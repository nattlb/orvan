
<!DOCTYPE html>

  <head>

    <!-- Recuperar rutas internas de GitHub Pages -->
    <script>
      (function () {
        var parametros = new URLSearchParams(window.location.search);
        var ruta = parametros.get('ruta');

        if (ruta && ruta.startsWith('/')) {
          var busqueda = parametros.get('busqueda') || '';

          window.history.replaceState(
            null,
            '',
            '/orvan' + ruta + busqueda + window.location.hash
          );
        }
      })();
    </script>
